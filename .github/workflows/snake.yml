name: Update monthly contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/**"

permissions: {}

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out pinned snake rendering engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Platane/snk
          ref: d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
          path: .snk-upstream
          persist-credentials: false

      - name: Build month-specific generator
        run: |
          npx --yes --package=esbuild@0.25.12 esbuild .github/scripts/monthly-snake.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --alias:@snk/types=./.snk-upstream/packages/types \
            --alias:@snk/solver=./.snk-upstream/packages/solver \
            --alias:@snk/svg-creator=./.snk-upstream/packages/svg-creator \
            --outfile=dist/monthly-snake.mjs

      - name: Validate month boundaries and rendering
        run: node --test .github/scripts/monthly-snake.test.mjs

      - name: Generate this month's contribution snakes
        run: node dist/monthly-snake.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish animation to output branch
        shell: bash
        run: |
          set -euo pipefail
          animation_dir="$(mktemp -d)"
          cp dist/github-snake-monthly.svg dist/github-snake-monthly-dark.svg "$animation_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null; then
            git fetch --depth=1 origin output
            git checkout --detach FETCH_HEAD
          else
            git checkout --orphan output
            git rm -rf --ignore-unmatch .
          fi

          cp "$animation_dir/github-snake-monthly.svg" "$animation_dir/github-snake-monthly-dark.svg" .
          git add -- github-snake-monthly.svg github-snake-monthly-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animation is already up to date."
            exit 0
          fi

          git commit -m "Update monthly contribution snake"
          git push origin HEAD:output

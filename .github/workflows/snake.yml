name: Update contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions: {}

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            dist/github-snake.svg?color_snake=#0ea5e9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8

      - name: Publish animation to output branch
        shell: bash
        run: |
          set -euo pipefail
          animation_dir="$(mktemp -d)"
          cp dist/github-snake.svg dist/github-snake-dark.svg "$animation_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null; then
            git fetch --depth=1 origin output
            git checkout --detach FETCH_HEAD
          else
            git checkout --orphan output
            git rm -rf --ignore-unmatch .
          fi

          cp "$animation_dir/github-snake.svg" "$animation_dir/github-snake-dark.svg" .
          git add -- github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animation is already up to date."
            exit 0
          fi

          git commit -m "Update contribution snake"
          git push origin HEAD:output
